name: bootstrap-format

on:
  push:
    branches: [feat/foundation-delivery]

permissions:
  contents: write

jobs:
  format-and-lock:
    if: "!contains(github.event.head_commit.message, 'chore: apply foundation formatting and lockfile')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/foundation-delivery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - name: Commit generated lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting or lockfile changes to commit."
          else
            git commit -m "chore: apply foundation formatting and lockfile"
            git push origin HEAD:feat/foundation-delivery
          fi
