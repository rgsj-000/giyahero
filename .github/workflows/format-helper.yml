name: format-helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agency-verification
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Format agency verification files
        run: >-
          pnpm exec prettier --write
          docs/superpowers/plans/2026-09-29-agency-verification.md
          tests/integration/agency-verification-audit.test.ts
      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet -- docs/superpowers/plans/2026-09-29-agency-verification.md tests/integration/agency-verification-audit.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-29-agency-verification.md tests/integration/agency-verification-audit.test.ts
          git commit -m "style: format verification audit test"
          git push origin HEAD:feat/agency-verification
